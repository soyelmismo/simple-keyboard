apply plugin: 'com.android.application'

def getGitVersionName() {
    try {
        def tagText = providers.exec {
            commandLine 'git', 'tag', '--merged', 'HEAD', '--sort=-v:refname', 'v[0-9]*'
        }.standardOutput.asText.get()

        def tags = tagText.readLines().collect { it.trim() }.findAll { !it.isEmpty() }
        if (!tags.isEmpty()) {
            def latestTag = tags[0]
            def countText = providers.exec {
                commandLine 'git', 'rev-list', '--count', "${latestTag}..HEAD"
            }.standardOutput.asText.get().trim()
            int count = countText.isInteger() ? countText.toInteger() : 0
            def cleanTag = latestTag.replaceFirst('^v', '')
            if (count > 0) {
                def shortHash = providers.exec {
                    commandLine 'git', 'rev-parse', '--short', 'HEAD'
                }.standardOutput.asText.get().trim()
                return "${cleanTag}-${count}-g${shortHash}"
            }
            return cleanTag
        }

        def fallback = providers.exec {
            commandLine 'git', 'describe', '--tags', '--always'
        }.standardOutput.asText.get().trim().replaceFirst('^v', '')
        return fallback.isEmpty() ? "1.0.0" : fallback
    } catch (Exception ignored) {
        return "1.0.0"
    }
}

def computeVersionCode(String versionName) {
    try {
        def rawParts = versionName.split('-')
        def clean = rawParts[0]
        int extraCount = 0
        if (rawParts.length >= 2 && rawParts[1].isInteger()) {
            extraCount = rawParts[1].toInteger()
        }
        def parts = clean.split('\\.')
        if (parts.length >= 3) {
            int major = parts[0].toInteger()
            int minor = parts[1].toInteger()
            int patch = parts[2].toInteger()
            return major * 10000 + minor * 100 + patch + extraCount
        } else if (parts.length == 2) {
            int major = parts[0].toInteger()
            int minor = parts[1].toInteger()
            return major * 10000 + minor * 100 + extraCount
        } else if (parts.length == 1 && parts[0].isInteger()) {
            return parts[0].toInteger() + extraCount
        }
    } catch (Exception ignored) {
    }
    return 1
}

def appVersionName = project.findProperty("versionName") ?: getGitVersionName()
def appVersionCode = project.findProperty("versionCode") ? project.property("versionCode").toInteger() : computeVersionCode(appVersionName)

// Locales packaged into the APK: the base locale declared in res/resources.properties plus
// every values-<locale> directory that ships a strings.xml. Translations bundled by libraries
// for any other locale are stripped, so adding a translation directory is the only step needed.
def resDir = file("src/main/res")
def baseLocale = "en"
def resourcesPropsFile = new File(resDir, "resources.properties")
if (resourcesPropsFile.isFile()) {
    def resourcesProps = new Properties()
    resourcesPropsFile.withInputStream { resourcesProps.load(it) }
    baseLocale = resourcesProps.getProperty("unqualifiedResLocale", baseLocale)
}
def localeDirPattern = ~/values-([a-z]{2,3}(?:-r[A-Z]{2})?)/
def translatedLocales = []
    resDir.listFiles()?.each { file ->
        if (file.isDirectory() && new File(file, "strings.xml").isFile()) {
            def matcher = localeDirPattern.matcher(file.name)
            if (matcher.matches()) translatedLocales << matcher.group(1)
        }
    }

android {
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId "rkr.simplekeyboard.inputmethod"
        compileSdk 37
        minSdkVersion 23
        targetSdkVersion 37
        versionCode appVersionCode
        versionName appVersionName
        resourceConfigurations += ([baseLocale] + translatedLocales).unique()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17", "-O3", "-ffast-math"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }
    signingConfigs {
        release {
            Properties localProps = new Properties()
            def localPropsFile = project.rootProject.file("local.properties")
            if (localPropsFile.exists()) {
                localPropsFile.withInputStream { localProps.load(it) }
            }

            def keystorePath = System.getenv("KEYSTORE_PATH") ?: (project.findProperty("KEYSTORE_PATH") ?: (localProps.getProperty("KEYSTORE_PATH") ?: "../release.jks"))
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: (project.findProperty("KEYSTORE_PASSWORD") ?: (localProps.getProperty("KEYSTORE_PASSWORD") ?: "FoPNaL0ACLWpEh30"))
                keyAlias System.getenv("KEY_ALIAS") ?: (project.findProperty("KEY_ALIAS") ?: (localProps.getProperty("KEY_ALIAS") ?: "simplekeyboard"))
                keyPassword System.getenv("KEY_PASSWORD") ?: (project.findProperty("KEY_PASSWORD") ?: (localProps.getProperty("KEY_PASSWORD") ?: "FoPNaL0ACLWpEh30"))
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                storeFile signingConfigs.debug.storeFile
                storePassword signingConfigs.debug.storePassword
                keyAlias signingConfigs.debug.keyAlias
                keyPassword signingConfigs.debug.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    packaging {
        resources {
            excludes += [
                "DebugProbesKt.bin",
                "kotlin-tooling-metadata.json",
                "META-INF/*.version",
                "META-INF/androidx/**"
            ]
        }
    }
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    buildFeatures {
        buildConfig = true
    }
    namespace 'rkr.simplekeyboard.inputmethod'
}

dependencies {
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.autofill:autofill:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
}

tasks.register("compileHostNativeLib", Exec) {
    def outputDir = file("${project.layout.buildDirectory.get().asFile}/host-native")
    def outputFile = file("${outputDir}/libmicrotransformer.so")
    outputs.file(outputFile)
    inputs.files(fileTree("src/main/cpp") { include "*.cpp", "*.h" })
    doFirst {
        outputDir.mkdirs()
    }
    def javaHome = System.getProperty("java.home")
    def jniInclude = "${javaHome}/include"
    def jniIncludeLinux = "${javaHome}/include/linux"
    commandLine "clang++", "-shared", "-fPIC", "-O3", "-msse4.2", "-std=c++17",
            "-I${jniInclude}", "-I${jniIncludeLinux}",
            "src/main/cpp/micro_transformer.cpp",
            "src/main/cpp/micro_frontier_engine.cpp",
            "src/main/cpp/micro_transformer_jni.cpp",
            "-o", outputFile.absolutePath
}

tasks.withType(Test).configureEach {
    dependsOn "compileHostNativeLib"
    systemProperty "java.library.path", "${project.layout.buildDirectory.get().asFile}/host-native"
}


